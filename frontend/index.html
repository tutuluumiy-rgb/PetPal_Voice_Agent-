<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球球语音管道测试</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #faf6f0;
    color: #333;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    padding: 24px;
    min-height: 100vh;
    margin: 0;
    gap: 20px;
  }
  /* 左栏：主交互区 */
  #left-panel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* 右栏：事件流看板（固定宽度） */
  #right-panel {
    width: 420px;
    flex-shrink: 0;
    position: sticky;
    top: 24px;
    display: flex;
    flex-direction: column;
  }
  h1 { color: #e8843c; font-size: 28px; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
  #status {
    background: #fff;
    border: 2px solid #eee;
    border-radius: 16px;
    padding: 20px 32px;
    font-size: 20px;
    margin-bottom: 24px;
    min-width: 280px;
    text-align: center;
    transition: all 0.3s;
  }
  #status.listening { border-color: #7ec87e; background: #f0faf0; }
  #status.speaking { border-color: #e8b43c; background: #fffaf0; }
  #status.thinking { border-color: #8ab8e8; background: #f0f6ff; }
  #btn {
    background: #e8843c;
    color: #fff;
    border: none;
    border-radius: 40px;
    padding: 14px 40px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #btn:hover { background: #d6752f; }
  #btn:disabled { background: #ccc; cursor: not-allowed; }
  #log {
    margin-top: 30px;
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    min-height: 120px;
    font-size: 14px;
    color: #555;
    white-space: pre-wrap;
    border: 1px solid #eee;
  }
  .log-user { color: #2b6cb0; }
  .log-ball { color: #e8843c; }
  .log-sys { color: #999; }
  .log-vad-front { color: #9b59b6; }  /* 前端VAD事件（紫色） */
  .log-vad-back { color: #16a085; }   /* 后端VAD二次确认（青色） */

  #timing {
    margin-top: 20px;
    width: 100%;
    max-width: 560px;
    background: #1e1e2e;
    border-radius: 12px;
    padding: 16px;
    color: #cdd6f4;
    font-family: Consolas, monospace;
    font-size: 13px;
  }
  #timing .bar-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  #timing .bar-label {
    width: 60px;
    flex-shrink: 0;
    color: #a6adc8;
  }
  #timing .bar-track {
    flex: 1;
    height: 14px;
    background: #313244;
    border-radius: 7px;
    overflow: hidden;
  }
  #timing .bar-fill {
    height: 100%;
    border-radius: 7px;
    transition: width 0.3s;
  }
  #timing .bar-value {
    width: 70px;
    text-align: right;
    flex-shrink: 0;
    color: #f5c2e7;
  }
  .fill-asr { background: #89b4fa; }
  .fill-llm { background: #a6e3a1; }
  .fill-tts { background: #f9e2af; }

  /* 事件流看板（右栏） */
  #event-panel {
    background: #1e1e2e;
    border-radius: 12px;
    padding: 16px;
    color: #cdd6f4;
    font-family: Consolas, monospace;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 48px);
    min-height: 400px;
  }
  /* 事件流滚动区（可鼠标滚动） */
  #event-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
    padding-right: 4px;
  }
  #event-list::-webkit-scrollbar { width: 8px; }
  #event-list::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  .event-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 6px;
    background: #313244;
    animation: eventIn 0.3s ease;
  }
  .event-round {
    color: #6c7086;
    flex-shrink: 0;
    font-size: 11px;
    min-width: 34px;
  }
  .event-ts {
    color: #a6adc8;
    flex-shrink: 0;
    font-size: 11px;
    min-width: 44px;
  }
  .event-stage {
    flex-shrink: 0;
    font-weight: bold;
    min-width: 70px;
  }
  .event-detail {
    flex: 1;
    color: #cdd6f4;
    word-break: break-all;
  }
  .event-dur {
    flex-shrink: 0;
    color: #f5c2e7;
    font-size: 11px;
  }
  .stage-VAD { color: #89b4fa; }
  .stage-ASR { color: #89dceb; }
  .stage-LLM { color: #a6e3a1; }
  .stage-TTS { color: #f9e2af; }
  .stage-Barge { color: #f38ba8; }

  @keyframes eventIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 底部平均面板（固定，不随事件流滚动） */
  #avg-panel {
    flex-shrink: 0;
    padding-top: 12px;
    border-top: 1px solid #45475a;
  }
  #avg-bars {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #avg-bars .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #avg-bars .bar-label {
    width: 70px;
    flex-shrink: 0;
    color: #a6adc8;
    font-size: 12px;
  }
  #avg-bars .bar-track {
    flex: 1;
    height: 10px;
    background: #313244;
    border-radius: 5px;
    overflow: hidden;
  }
  #avg-bars .bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.3s;
  }
  #avg-bars .bar-value {
    width: 56px;
    text-align: right;
    flex-shrink: 0;
    color: #f5c2e7;
    font-size: 12px;
  }
</style>
</head>
<body>
  <!-- 左栏：主交互区 -->
  <div id="left-panel">
    <h1>球球 🐱</h1>
    <div class="subtitle">语音管道测试：AEC → VAD → ASR → LLM → TTS</div>

    <div id="status">未连接</div>
    <button id="btn" onclick="toggle()">开始对话</button>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
      <button id="mode-btn" onclick="toggleMode()" style="padding:6px 12px;border-radius:8px;border:1px solid #89dceb;background:#181825;color:#89dceb;cursor:pointer;font-size:13px;">🔄 模式：闲聊</button>
    </div>
    <div id="log"></div>
  </div>

  <!-- 右栏：事件流看板 -->
  <div id="right-panel">
    <div id="event-panel">
      <div style="margin-bottom:10px;color:#f5c2e7;">📊 事件流</div>
      <div id="event-list"></div>
      <!-- 底部固定的平均指标 -->
      <div id="avg-panel">
        <div style="margin-bottom:6px;color:#89dceb;">平均指标（<span id="avg-count">0</span> 轮）</div>
        <!-- 打断延迟（独立指标，静态占位，JS 更新数值） -->
        <div id="barge-avg-row" style="display:flex;align-items:center;gap:8px;margin:6px 0;">
          <span style="color:#f38ba8;font-size:12px;width:70px;flex-shrink:0;font-weight:bold;">打断延迟</span>
          <div style="flex:1;height:10px;background:#313244;border-radius:5px;overflow:hidden;">
            <div id="barge-avg-fill" style="height:100%;width:0%;background:#f38ba8;border-radius:5px;"></div>
          </div>
          <span id="barge-avg-value" style="width:56px;text-align:right;color:#f38ba8;font-size:12px;font-weight:bold;">-</span>
        </div>
        <div id="avg-bars"></div>
      </div>
    </div>
  </div>

<!-- 本地加载 onnxruntime-web 和 vad-web（UMD 全局版本，不依赖 esm.sh） -->
<script src="./vad/ort.min.js"></script>
<script src="./vad/bundle.min.js"></script>
<script>
// vad-web 挂到 window.vad（bundle.min.js 里 e.vad = ...）
// onnxruntime-web 挂到 window.ort（bundle.min.js 里 e.ort = ...）

let ws = null;
let audioCtx = null;
let stream = null;
let source = null;
let processor = null;
let isRunning = false;
let frontendVad = null;  // 前端 Silero VAD 实例

// ══════════════════════════════════════════════════════════
// 🎛 前端打断参数区（体感层）—— 集中调这里！
// 双层打断架构：前端负责「体感」（快），后端负责「业务决策」（准）
// 前端只上报事件，不参与最终是否打断的决策
// ══════════════════════════════════════════════════════════

// 【Ducking 音量】打断瞬间，本地先把播放音量压到这个比例（0~1）
// 0.2 = 压到 20% 音量，保留一点声音避免突兀；后端确认真打断后再完全静音
// 调 0 = 立即完全静音（更果断，但误判时突兀）
DUCKING_GAIN = 0.2

// 【Ducking 超时兜底】ducking 生效后，若既没有 barge_confirm/barge_reject 也没有
// onSpeechEnd/onVADMisfire 触发（消息丢失/竞态），超时后强制恢复音量。
// 修复：误报后音量未真正恢复的问题（之前无兜底，恢复依赖事件，丢一个就卡住）
DUCKING_TIMEOUT_MS = 2000

// 【Silero VAD 人声阈值】高于此值判定为「有人声」
// 调大 → 更严格（只认明显人声）；调小 → 更敏感
// 0.4→0.5：降低环境噪音/回声误触发（噪音也能碰巧过 0.4）
VAD_POSITIVE_THRESHOLD = 0.4

// 【Silero VAD 静音阈值】低于此值判定为「静音」（人声结束）
// 0.4→0.35：说话中弱音/轻微停顿（音调下沉、轻声字）不易被判为静音，
//           避免「说话停顿一下就被判定结束」→ 后半句变成新的打断/轮次
VAD_NEGATIVE_THRESHOLD = 0.35

// 【最小人声帧数】连续多少帧人声才触发 onSpeechStart（即「判定为人声」）
// 1帧 = 96ms（Silero frameSamples=1536 @16kHz）
// 4→6：判定更扎实（576ms 确认）才触发 onSpeechStart → 才执行 ducking，
//      避免「还没判定好人声就先 ducking」的误报抖动
VAD_MIN_SPEECH_FRAMES = 6

// 【静音帧数】说话状态下连续多少帧低于静音阈值 → 判定人声结束（onSpeechEnd）
// 1帧 = 96ms
// 6→10：说话中途停顿（思考/换气）超过 576ms 就会被误判「说完了」→ 后半句变成新打断。
//       10 帧 = 960ms 静音才判定结束，覆盖正常停顿；代价是说完后 speech_end 晚 ~400ms（E2E 略增）。
//       若觉得 E2E 慢可改回 8（768ms 折中）；若仍有停顿被切断改 12（1152ms）。
VAD_REDEMPTION_FRAMES = 10

// ── 环形缓存（pre-roll ring buffer）──────────
// 持续保留最近 2 秒的 PCM 音频，打断时回退取「开口前」的预卷，防丢第一个字
const PRE_ROLL_BUFFER_SECONDS = 2;   // 环形缓存总长（秒）
const PRE_ROLL_MS = 256;             // 回退量（毫秒），从VAD触发点往前取这么多
const PCM_BYTES_PER_SEC = 16000 * 2; // 16kHz 16bit 单声道 = 32000字节/秒
const PRE_ROLL_BUFFER_BYTES = PRE_ROLL_BUFFER_SECONDS * PCM_BYTES_PER_SEC; // 64000字节
let preRollBuffer = [];  // 存 {data: Uint8Array, timestamp: number} 的环形队列
const PRE_ROLL_MS_BYTES = (PRE_ROLL_MS / 1000) * PCM_BYTES_PER_SEC; // 回退字节数

// ── 前端打断状态 ──────────────────────────────
let duckingActive = false;      // 当前是否处于 ducking 状态
let duckingTimer = null;        // ducking 恢复定时器
let ballIsPlaying = false;      // 球球是否正在播放（用于体感层 ducking 判断）
let pendingPlaybackDone = false; // 是否已收到 reply_end、等待音频真正播完
let confirmedDucking = false;   // 后端已确认打断：保持 ducking 直到 speech_end 才真正停止
let bargeConfirmed = false;     // 后端已发 barge_confirm（用于：前端 misfire 时不再反向恢复）
let pendingBargeResume = false; // barge_confirm 后播放器进入「静音等待」：等 asr_final（有效→销毁）或 resume_playback（无内容→恢复播完）
let bargeResumeTimer = null;    // 静音等待兜底定时器（3s 无信号销毁播放器）
let speechStartTime = null;     // 用户开口时刻（performance.now），用于算打断延迟
let speechSendTime = null;      // speech_start 消息发送时刻（用于分解传输延迟）
let playbackDoneTimer = null;   // client_playback_done 兜底定时器（防丢包）
let userSpeechFinishTs = null;  // 用户输入完成时刻（onSpeechEnd），用于算真实端到端
let playFirstFrameTs = null;    // 第一帧TTS音频开始播放时刻，用于算真实端到端

const statusEl = document.getElementById('status');
const btnEl = document.getElementById('btn');
const logEl = document.getElementById('log');

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function log(text, cls) {
  const div = document.createElement('div');
  div.className = cls || '';
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function appendToLastBallMsg(text) {
  // 找到日志区最后一条球球消息，追加文本
  const children = logEl.children;
  for (let i = children.length - 1; i >= 0; i--) {
    if (children[i].classList.contains('log-ball')) {
      children[i].textContent += text;
      break;
    }
  }
  logEl.scrollTop = logEl.scrollHeight;
}

// ── ASR 流式展示 ──────────────────────────────────
let asrPartialEl = null;  // 正在识别的临时行（"你：（正在识别...）"）

function updateAsrPartial(text) {
  // 用户正在说话，实时显示识别中的文本（流式效果）
  if (!asrPartialEl) {
    asrPartialEl = document.createElement('div');
    asrPartialEl.className = 'log-user';
    logEl.appendChild(asrPartialEl);
  }
  asrPartialEl.textContent = '你：' + text + '▌';  // ▌是光标，表示还在识别
  logEl.scrollTop = logEl.scrollHeight;
}

function finalizeAsr(text) {
  // ASR 完成：把临时行转正为最终用户消息
  if (asrPartialEl) {
    asrPartialEl.textContent = '你：' + text;  // 去掉光标
    asrPartialEl = null;  // 重置，下次识别新建
  } else {
    // 没有过 partial（比如识别很快），直接显示最终结果
    log('你：' + text, 'log-user');
  }
  logEl.scrollTop = logEl.scrollHeight;
}

async function toggle() {
  if (isRunning) { await stop(); } else { await start(); }
}

// ESM 模块作用域，函数不会挂到 window，但 onclick 属性访问的是全局
// 显式挂到 window，让 HTML 的 onclick="toggle()" 能找到
window.toggle = toggle;

// ── 双模式（闲聊/工作）手动切换 ──────────────────────────
let currentMode = 'chat';

function applyMode(mode) {
  currentMode = (mode === 'work') ? 'work' : 'chat';
  const el = document.getElementById('mode-btn');
  if (el) el.textContent = '🔄 模式：' + (currentMode === 'work' ? '工作' : '闲聊');
}
window.applyMode = applyMode;

function toggleMode() {
  if (!ws || ws.readyState !== WebSocket.OPEN) { alert('未连接后端'); return; }
  ws.send(JSON.stringify({ type: 'set_mode', mode: 'toggle' }));
}
window.toggleMode = toggleMode;

function queryMode() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'get_mode' }));
  }
}
window.queryMode = queryMode;

async function start() {
  try {
    // 1. 连接后端 WebSocket
    ws = new WebSocket('ws://127.0.0.1:8001/ws/audio');
    ws.binaryType = 'arraybuffer';
    ws.onmessage = onMessage;
    ws.onclose = () => {
      if (isRunning) {
        setStatus('连接断开', '');
        // 只清理，不再调用 stop() 避免二次关闭
        isRunning = false;
        btnEl.textContent = '开始对话';
        if (processor) { processor.disconnect(); }
        if (stream) { stream.getTracks().forEach(t => t.stop()); }
        log('连接断开', 'log-sys');
      }
    };
    // 等待连接成功；失败时 reject，避免 start() 永远卡在 onopen（原来无 onerror 处理）
    await new Promise((res, rej) => {
      ws.onopen = res;
      ws.onerror = () => rej(new Error('无法连接后端（ws://127.0.0.1:8001），请先启动后端'));
    });
    log('已连接后端', 'log-sys');
    queryMode(); // 连接后同步一次后端当前模式，刷新按钮显示

    // 2. 获取麦克风（关键：echoCancellation 开启 AEC）
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,      // 回声消除
        noiseSuppression: true,       // 降噪
        autoGainControl: true,        // 自动增益
        channelCount: 1,
        sampleRate: 16000,
      }
    });

    // 2.5 初始化前端 Silero VAD（人声检测，用于打断）
    await initFrontendVad();

    // 3. 采集音频并发送
    // buffer 大小关键：4096 采样点 = 256ms 缓冲，太大会导致打断延迟
    // 改成 1024 采样点 = 64ms，音频更快到达后端，打断响应更快
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    source = audioCtx.createMediaStreamSource(stream);
    processor = audioCtx.createScriptProcessor(1024, 1, 1);

    processor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      // 转 16bit PCM
      const pcm = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        pcm[i] = Math.max(-1, Math.min(1, input[i])) * 32767;
      }
      const pcmBytes = new Uint8Array(pcm.buffer);

      // 写入环形缓存（持续保留最近2秒）
      preRollBuffer.push({ data: pcmBytes, timestamp: performance.now() });
      // 砍掉超出2秒的部分
      let totalBytes = 0;
      for (const b of preRollBuffer) totalBytes += b.data.length;
      while (totalBytes > PRE_ROLL_BUFFER_BYTES && preRollBuffer.length > 0) {
        const removed = preRollBuffer.shift();
        totalBytes -= removed.data.length;
      }

      // 前端打断检测由 Silero VAD 的 onSpeechStart 回调触发（见 initFrontendVad）
      // 音频始终发送（保证不丢字）
      ws.send(pcm.buffer);
    };
    source.connect(processor);
    processor.connect(audioCtx.destination);

    isRunning = true;
    btnEl.textContent = '停止';
    setStatus('我在听，说吧…', 'listening');
    log('开始录音（AEC 已开启）', 'log-sys');
  } catch (err) {
    log('错误：' + err.message, 'log-sys');
    console.error(err);
    // 失败时清理资源，避免页面卡死（如 WS 连接失败时 onopen 永不到达）
    isRunning = false;
    btnEl.textContent = '开始对话';
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
}

async function stop() {
  isRunning = false;
  btnEl.textContent = '开始对话';
  setStatus('已停止', '');
  if (frontendVad) { try { frontendVad.destroy(); } catch (e) {} frontendVad = null; }
  if (processor) { processor.disconnect(); source.disconnect(); }
  if (stream) { stream.getTracks().forEach(t => t.stop()); }
  if (ws) { ws.close(); }
  log('已停止', 'log-sys');
}

function onMessage(event) {
  if (typeof event.data === 'string') {
    const msg = JSON.parse(event.data);
    switch (msg.type) {
      case 'mode_changed':
        // 双模式切换（语音指令或手动）→ 更新按钮 + 文字系统通知（不播报）
        applyMode(msg.mode);
        log('🔄 ' + (msg.notice || ('已经切换到' + (msg.mode === 'work' ? '工作模式' : '闲聊模式'))), 'log-sys');
        break;
      case 'user_text':
        log('你：' + msg.text, 'log-user');
        break;
      case 'asr_partial':
        // 流式展示：用户正在说话，实时更新识别中的文本（后端发全量修订，覆盖展示）
        updateAsrPartial(msg.text);
        break;
      case 'asr_cancel':
        // 误报撤销（后端 vad_cancel）：清掉残留的流式识别行（不会转正为 asr_final）
        if (asrPartialEl) {
          asrPartialEl.remove();
          asrPartialEl = null;
        }
        break;
      case 'asr_final':
        // ASR 完成：把临时展示收尾，转正为最终用户消息
        finalizeAsr(msg.text);
        // 打断后收到有效识别 → 这次打断成立，正式销毁播放器（不再等待恢复）
        if (pendingBargeResume && msg.text) {
          if (bargeResumeTimer) { clearTimeout(bargeResumeTimer); bargeResumeTimer = null; }
          stopStreamPlayback();
          pendingBargeResume = false;
        }
        break;
      case 'resume_playback':
        // 后端判定打断无有效输入（语气词/噪声被过滤）→ 恢复之前被打断的播报
        // （球球可能已说完，只是最后一点缓冲被静音；恢复音量让它自然播完）
        if (pendingBargeResume && pcmPlayback && pcmPlayback.gainNode) {
          console.log('[打断] 无有效输入，恢复播报音量');
          if (bargeResumeTimer) { clearTimeout(bargeResumeTimer); bargeResumeTimer = null; }
          try {
            const ctx = pcmPlayback.ctx;
            pcmPlayback.gainNode.gain.cancelScheduledValues(ctx.currentTime);
            pcmPlayback.gainNode.gain.setTargetAtTime(1.0, ctx.currentTime, 0.05);
          } catch (e) {}
          pendingBargeResume = false;
        }
        break;
      case 'reply_start':
        // 后端开始生成回复，标记球球进入播放状态（用于 ducking 等体感层）
        ballIsPlaying = true;
        break;
      case 'reply_end':
        // 后端整段回复发完，等所有音频块真正播完再发 playback_done
        pendingPlaybackDone = true;
        break;
      case 'reply':
        setStatus('球球在说话…', 'speaking');
        log('球球[' + msg.emotion + ']：' + msg.text, 'log-ball');
        break;
      case 'reply_append':
        // 后续句追加到上一条球球消息后面
        appendToLastBallMsg(msg.text);
        break;
      case 'barge_confirm':
        // 后端确认「真打断」：立即停止播报（不等 speech_end）
        setStatus('打断了球球', 'listening');
        // 分解打断延迟为三个阶段
        if (speechStartTime !== null) {
          const now = performance.now();
          const totalMs = now - speechStartTime;
          // 阶段0：开口 → VAD确认（前端VAD判定耗时）
          const vadMs = (speechSendTime !== null ? speechSendTime - speechStartTime : 0);
          // 阶段1：发送 → 后端确认返回（网络传输 + 后端二次确认）
          const networkMs = now - (speechSendTime !== null ? speechSendTime : speechStartTime);
          // 后端二次确认耗时（由后端随 barge_confirm 传回）
          const backendMs = msg.backend_ms !== undefined ? msg.backend_ms : 0;
          log('⏹ 打断（' + totalMs.toFixed(0) + 'ms）', 'log-sys');
          console.log(`[打断阶段] 总=${totalMs.toFixed(0)}ms | VAD=${vadMs.toFixed(0)}ms | 传输=${(networkMs - backendMs).toFixed(0)}ms | 后端确认=${backendMs.toFixed(0)}ms`);
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'barge_latency', latency: parseFloat((totalMs / 1000).toFixed(3)) }));
          }
        } else {
          log('⏹ 打断（延迟未知）', 'log-sys');
        }
        // 停止播放：确认打断后【保持 ducking】等待（不立即销毁播放器）
        // 语义（与双层架构对齐）：
        //   VAD 判定人声 → ducking（压低到 DUCKING_GAIN，体感层）
        //   barge_confirm → 保持 ducking（0.1）等待后端 ASR 结果 —— 完全静音发生在结果出来之后：
        //       - 收到有效 asr_final（打断成立）→ 销毁播放器（完全静音）
        //       - 收到 resume_playback（无有效输入，球球可能已说完）→ 恢复音量，球球把剩余播完
        //       - 3s 无信号 → 兜底销毁（防泄漏）
        if (pcmPlayback && pcmPlayback.gainNode) {
          try {
            const ctx = pcmPlayback.ctx;
            pcmPlayback.gainNode.gain.cancelScheduledValues(ctx.currentTime);
            pcmPlayback.gainNode.gain.setTargetAtTime(DUCKING_GAIN, ctx.currentTime, 0.02);  // 保持 ducking 音量
          } catch (e) {}
          pendingBargeResume = true;
          if (bargeResumeTimer) clearTimeout(bargeResumeTimer);
          bargeResumeTimer = setTimeout(() => {
            if (pendingBargeResume) {
              console.log('[打断] 3s 无后续信号，兜底销毁播放器');
              stopStreamPlayback();
              pendingBargeResume = false;
            }
          }, 3000);
        } else {
          stopStreamPlayback();
        }
        bargeConfirmed = true;  // 标记：后端已确认打断（misfire 不再反向恢复）
        confirmedDucking = false;
        duckingActive = false;
        speechStartTime = null;
        speechSendTime = null;
        break;
      case 'barge_reject':
        // 后端判定「误报」：恢复音量 + 显示给用户
        log('⏹ 误报（后端判噪声，恢复音量）', 'log-vad-back');
        stopDucking();
        break;
      case 'stop_playback':
        // 最终回复到来：立即停止当前（进度）音频播放，直接转最终回复
        stopStreamPlayback();
        break;
      case 'tts_start':
        setStatus('球球在说话…', 'speaking');
        // 新一轮播放开始，但【不】清 speechStartTime！
        // speechStartTime 用于打断延迟计时，要保留到 barge_confirm 消费。
        // 如果这里清空，打断确认时 speechStartTime 为 null → 「延迟未知」
        confirmedDucking = false;
        startStreamPlayback();
        // 上报「喇叭真正开始发声」—— 后端据此打开打断窗口
        // 解决排队模式：TTS已下发但喇叭未响时，后端以为是listening
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'client_play_start' }));
        }
        // 兜底：playback_done 丢包防护
        // 如果 15 秒内没正常发 client_playback_done（onended 丢失），强制补发
        // 否则后端永远收不到播放完成，打断窗口不闭合
        if (playbackDoneTimer) clearTimeout(playbackDoneTimer);
        playbackDoneTimer = setTimeout(() => {
          if (pendingPlaybackDone) {
            console.log('[播放兜底] 超时未收到播放完成，强制补发 client_playback_done');
            pendingPlaybackDone = false;
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'client_playback_done' }));
            }
          }
        }, 15000);
        break;
      case 'tts_end':
        setStatus('我在听，说吧…', 'listening');
        break;
      case 'event':
        addEventRow(msg);
        break;
      case 'timing':
        updateAvgPanel(msg);
        // 不再在这里设 ballIsPlaying = false！
        // 后端 timing 是「发送完」，但前端音频可能还在播放队列里。
        // ballIsPlaying 应该由前端「实际播放完」决定（见 feedPcm 的 source.onended）
        break;
      case 'barge_avg':
        updateBargeAvg(msg);
        break;
    }
  } else {
    // 二进制 PCM 音频块，边收边播
    feedPcm(new Uint8Array(event.data));
  }
}

  const round = document.createElement('span');

  row.appendChild(round);

  const ts = document.createElement('span');
  ts.className = 'event-ts';
  ts.textContent = '+' + msg.ts + 's';
  row.appendChild(ts);

  // 阶段名
  const stage = document.createElement('span');
  stage.className = 'event-stage stage-' + msg.stage.replace(/[^A-Za-z]/g, '');
  stage.textContent = msg.stage;
  row.appendChild(stage);

    row.appendChild(value);

// ── 流式 PCM 播放器（时间线调度版）──────────────────
let pcmPlayback = null;

function startStreamPlayback() {
  // 如果已有播放器在播，说明是「后续句」，直接复用，不重置（避免掐断上一句）
  if (pcmPlayback) {
    return;
  }
  pcmPlayback = {
    ctx: new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 }),
    nextStartTime: 0,   // 下一块音频的起始播放时间（时间线上连续接续）
    initialized: false,
    gainNode: null,     // 音量控制节点（打断时快速静音）
    activeSources: [],  // 已排队的音频源，打断时统一停止
  };
  // 加一个 gain 节点，打断时通过 gain=0 快速静音
  pcmPlayback.gainNode = pcmPlayback.ctx.createGain();
  pcmPlayback.gainNode.connect(pcmPlayback.ctx.destination);
  // 标记球球开始播放，启用前端打断检测
  ballIsPlaying = true;
  bargeArmed = false;   // 新一轮播放，重新武装打断
  bargeStartTime = null;
}

function feedPcm(pcm) {
  if (!pcmPlayback) return;
  const samples = new Int16Array(pcm.buffer, pcm.byteOffset, pcm.byteLength / 2);
  const floatBuf = new Float32Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    floatBuf[i] = samples[i] / 32768.0;
  }

  const ctx = pcmPlayback.ctx;
  const buffer = ctx.createBuffer(1, floatBuf.length, ctx.sampleRate);
  buffer.getChannelData(0).set(floatBuf);

  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(pcmPlayback.gainNode);  // 连到 gain 节点，而非直接 destination

  // 关键：用「时间线」接续播放，而不是各自独立 start
  let startAt;
  if (!pcmPlayback.initialized) {
    startAt = ctx.currentTime + 0.02;  // 首块稍等 20ms 缓冲
    pcmPlayback.initialized = true;
    // 记录第一帧开始播放时刻，计算真实端到端延迟（用户说完 → 喇叭第一帧出声）
    if (userSpeechFinishTs !== null) {
      playFirstFrameTs = performance.now();
      const e2eRealMs = playFirstFrameTs - userSpeechFinishTs;
      console.log(`[真实端到端] 用户说完→第一帧出声 = ${e2eRealMs.toFixed(0)}ms`);
      log(`🎯 真实端到端 ${e2eRealMs.toFixed(0)}ms`, 'log-sys');
      // 清空，避免下一轮误用
      userSpeechFinishTs = null;
      playFirstFrameTs = null;
    }
  } else {
    // 接续上一块，但如果上一块已经播完（nextStartTime 是过去），
    // 就从「当前时间 + 小缓冲」开始，避免追着过去的时间播导致重叠/丢音
    startAt = Math.max(pcmPlayback.nextStartTime, ctx.currentTime + 0.02);
  }

  // 计算这一块的时长，作为下一块的起始时间
  const duration = floatBuf.length / ctx.sampleRate;
  pcmPlayback.nextStartTime = startAt + duration;

  source.start(startAt);
  // 记录 active 的 source，打断时统一 stop
  pcmPlayback.activeSources.push(source);
  // source 播完后自动从列表移除
  source.onended = () => {
    const idx = pcmPlayback.activeSources.indexOf(source);
    if (idx >= 0) pcmPlayback.activeSources.splice(idx, 1);
    // 所有音频块播完 + 已收到 reply_end → 前端真正播放结束
    // 此时发 client_playback_done 给后端，后端才进入 listening + 保护期
    if (pcmPlayback && pcmPlayback.activeSources.length === 0 && pendingPlaybackDone) {
      pendingPlaybackDone = false;
      ballIsPlaying = false;
      // 正常发送，清除兜底定时器
      if (playbackDoneTimer) { clearTimeout(playbackDoneTimer); playbackDoneTimer = null; }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'client_playback_done' }));
      }
    }
  };
}

function stopStreamPlayback() {
  // 打断时清除播放完成兜底定时器（播放已停止，不需要兜底）
  if (playbackDoneTimer) { clearTimeout(playbackDoneTimer); playbackDoneTimer = null; }
  // 清理「静音等待恢复」状态（播放器已销毁，无需恢复）
  if (bargeResumeTimer) { clearTimeout(bargeResumeTimer); bargeResumeTimer = null; }
  pendingBargeResume = false;
  if (pcmPlayback) {
    // 打断时：1. 立即静音（gain 瞬间归零，消除残音）
    try {
      if (pcmPlayback.gainNode) {
        pcmPlayback.gainNode.gain.setValueAtTime(0, pcmPlayback.ctx.currentTime);
      }
    } catch (e) {}
    // 2. 停止所有已排队的 source
    for (const s of pcmPlayback.activeSources) {
      try { s.stop(); } catch (e) {}
    }
    pcmPlayback.activeSources = [];
    // 3. 关闭音频上下文
    try { pcmPlayback.ctx.close(); } catch (e) {}
    pcmPlayback = null;
  }
}

// ── Ducking：体感层快速压低音量（不立即静音）──────────
function startDucking() {
  // 只有球球正在播放时才需要 ducking
  if (!pcmPlayback || !pcmPlayback.gainNode) {
    console.log('[ducking] 球球没在播放，跳过 ducking, pcmPlayback=', pcmPlayback);
    return false;
  }

  duckingActive = true;
  console.log('[ducking] 执行 ducking, 当前gain=', pcmPlayback.gainNode.gain.value);
  try {
    const ctx = pcmPlayback.ctx;
    const gain = pcmPlayback.gainNode.gain;
    gain.cancelScheduledValues(ctx.currentTime);
    gain.setTargetAtTime(DUCKING_GAIN, ctx.currentTime, 0.03);
    console.log('[ducking] 已设置目标 gain=', DUCKING_GAIN, '当前', ctx.currentTime);
  } catch (e) {
    console.log('[ducking] 异常:', e);
  }
  // 超时兜底：若 barge_confirm/barge_reject/onSpeechEnd/onVADMisfire 都没触发
  // （消息丢失/竞态），超时后强制恢复音量——修复「误报后音量未真正恢复」
  if (duckingTimer) { clearTimeout(duckingTimer); }
  duckingTimer = setTimeout(() => {
    console.log('[ducking] 超时无确认，强制恢复音量');
    stopDucking();
  }, DUCKING_TIMEOUT_MS);
  return true;
}

function stopDucking() {
  // 无条件恢复音量（不能依赖 duckingActive，误报恢复时可能已是 false）
  duckingActive = false;
  if (duckingTimer) { clearTimeout(duckingTimer); duckingTimer = null; }
  if (pcmPlayback && pcmPlayback.gainNode) {
    try {
      const ctx = pcmPlayback.ctx;
      const gain = pcmPlayback.gainNode.gain;
      gain.cancelScheduledValues(ctx.currentTime);
      gain.setTargetAtTime(1.0, ctx.currentTime, 0.05);
    } catch (e) {}
  }
}

// ── 前端 Silero VAD 初始化（人声检测）────────────
async function initFrontendVad() {
  try {
    const base = location.href.replace(/\/[^\/]*$/, '/');
    // 配置 onnxruntime-web 的 WASM 路径（本地文件）
    if (window.ort && window.ort.env) {
      window.ort.env.wasm.wasmPaths = base + 'vad/';
    }
    // 用全局 window.vad.MicVAD（bundle.min.js 挂的 UMD 全局对象）
    const vadLib = window.vad;
    frontendVad = await vadLib.MicVAD.new({
      modelURL: base + 'vad/silero_vad.onnx',
      workletURL: base + 'vad/vad.worklet.bundle.min.js',
      stream: stream,  // 复用已获取的麦克风流（已开 AEC）
      // 人声检测回调（onSpeechStart = 前端已确认人声 → ducking + 上报预卷）
      onSpeechStart: () => {
        console.log('[VAD] onSpeechStart（判定为人声 → ducking + 上报预卷）');
        // 0. 记录用户开口时刻（用于算打断延迟：开口 → 停止播报）
        speechStartTime = performance.now();
        bargeConfirmed = false;  // 新一轮判定开始，重置后端确认标记
        // 1. 前端已确认人声（连续 VAD_MIN_SPEECH_FRAMES 帧过阈值）→ 立即 ducking（体感层快速响应）
        //    这是「判定为人声之后再处理 ducking」：onSpeechStart 就是前端判定结果。
        //    误报由 onVADMisfire 恢复音量，由后端 barge_reject 拒绝打断（双层兜底）。
        const ducked = startDucking();
        // 日志如实反映 ducking 是否真正执行（球球没在播时 startDucking 会跳过）
        log(ducked ? '【前端VAD】判定为人声 → ducking + 上报预卷'
                   : '【前端VAD】判定为人声 → 球球未播放，跳过 ducking + 上报预卷', 'log-vad-front');
        // 2. 从环形缓存切出预卷（补VAD触发延迟丢的首字）
        const preRoll = slicePreRoll();
        // 3. 上报事件给后端，带上预卷（后端合并二次确认）
        if (ws && ws.readyState === WebSocket.OPEN) {
          speechSendTime = performance.now();  // 记录发送时刻
          ws.send(JSON.stringify({
            type: 'speech_start',
            preRollBase64: preRoll ? arrayBufferToBase64(preRoll.buffer) : null,
          }));
        }
      },
      onSpeechEnd: () => {
        console.log('[VAD] onSpeechEnd（上报 speech_end 事件）');
        log('【前端VAD】人声结束 → 上报', 'log-vad-front');
        // 记录用户输入完成时刻（用于真实端到端延迟：说完 → 第一帧出声）
        userSpeechFinishTs = performance.now();
        // 兜底：如果 barge_confirm 后还有残余播放（极少数情况），speech_end 时清理
        if (confirmedDucking) {
          stopStreamPlayback();
          confirmedDucking = false;
          duckingActive = false;
          speechStartTime = null;
        }
        // 重要：非打断场景（后端没发 barge_reject 就正常说话了）也恢复音量
        // 否则 ducking 会一直卡着（球球刚播完你开口，speech_start 走 listening 分支，
        // 后端不发 barge_reject，音量永远恢复不了）
        stopDucking();
        // 上报人声结束事件
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'speech_end' }));
        }
      },
      onVADMisfire: () => {
        console.log('[VAD] onVADMisfire（误报，延迟恢复音量）');
        // 前后端判定一致性：若后端已确认打断（barge_confirm，球球已停），
        // 前端的 misfire 是"事后反悔"，无需再恢复音量（播放器已销毁）
        if (bargeConfirmed) {
          console.log('[VAD] 后端已确认打断，忽略 misfire 恢复');
          return;
        }
        log('【前端VAD】误报 → 延迟恢复音量 + 撤销后端会话', 'log-vad-front');
        // 关键：通知后端撤销本次 speech_start 启动的 ASR 会话。
        // 否则后端 is_user_speaking 一直卡 True，用户后续真实说话会被防重入忽略、
        // 音频喂进噪声会话 → 识别错乱、LLM 被阻塞（实测问题）。
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'vad_cancel' }));
        }
        // 修复「ducking 未生效」：misfire 不立即恢复音量（否则 ducking 只持续 ~100ms 无感，
        // 且可能误伤「快速说的真插话」——说一两个字后 VAD 就 misfire）。
        // 延迟 400ms 恢复：给后端确认窗口——
        //   400ms 内 barge_confirm → 打断（ducking 持续到停播 ✓）
        //   400ms 内 barge_reject → 立即恢复（stopDucking 会清掉本定时器）
        //   都没有 → 400ms 后兜底恢复（音量不卡住）
        duckingTimer = setTimeout(() => {
          if (bargeConfirmed) return;
          console.log('[ducking] misfire 延迟恢复音量');
          stopDucking();
        }, 400);
      },
      positiveSpeechThreshold: VAD_POSITIVE_THRESHOLD,
      negativeSpeechThreshold: VAD_NEGATIVE_THRESHOLD,
      minSpeechFrames: VAD_MIN_SPEECH_FRAMES,
      redemptionFrames: VAD_REDEMPTION_FRAMES,
      preSpeechPadFrames: 1,
    });
    frontendVad.start();
    log('前端 Silero VAD 已就绪', 'log-sys');
  } catch (err) {
    console.error('VAD 初始化失败:', err);
    log('VAD 初始化失败，打断退化为能量检测', 'log-sys');
    frontendVad = null;
  }
}

// ── 前端本地打断（用户插话时调用）──────────────
function localBargeIn() {
  // 1. 计算真实打断响应延迟 = 你开口（VAD检测到人声）→ 现在（静音）
  let bargeLatency = null;
  if (bargeStartTime !== null) {
    bargeLatency = (performance.now() - bargeStartTime) / 1000;  // 转秒
  }

  // 2. 从环形缓存切出「回退256ms」的预卷音频（你开口前的那段，防止丢第一个字）
  const preRoll = slicePreRoll();

  // 3. 立即本地静音（零网络延迟）
  stopStreamPlayback();

  // 4. 通知后端「打断了」，带上预卷音频和打断延迟
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: 'client_barge_in',
      latency: bargeLatency !== null ? parseFloat(bargeLatency.toFixed(3)) : null,
      preRollBase64: preRoll ? arrayBufferToBase64(preRoll.buffer) : null,
    }));
  }

  // 5. 更新 UI 状态
  setStatus('打断了球球', 'listening');
  log('⏹ 打断（VAD检测，响应 ' + (bargeLatency !== null ? (bargeLatency * 1000).toFixed(0) + 'ms' : '?') + '）', 'log-sys');

  // 6. 重置打断检测状态
  bargeStartTime = null;
  // 立即重置 bargeArmed，不依赖 onSpeechEnd（避免卡死在 true 导致后续打断失效）
  // 等下一轮球球开始播放时会重新武装
  bargeArmed = false;
}

// ── 从环形缓存切出「回退 PRE_ROLL_MS 毫秒」的预卷音频 ──
function slicePreRoll() {
  if (preRollBuffer.length === 0) return null;
  // 从最新的块往前累计，凑够 PRE_ROLL_MS_BYTES 字节
  const chunks = [];
  let collected = 0;
  for (let i = preRollBuffer.length - 1; i >= 0; i--) {
    chunks.unshift(preRollBuffer[i].data);
    collected += preRollBuffer[i].data.length;
    if (collected >= PRE_ROLL_MS_BYTES) break;
  }
  // 合并成一段连续的 Uint8Array
  const merged = new Uint8Array(collected);
  let offset = 0;
  for (const c of chunks) {
    merged.set(c, offset);
    offset += c.length;
  }
  return merged;
}

// ── ArrayBuffer → base64（用于通过 JSON 传输二进制音频）──
function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// 播放缓存的 MP3 音频（已废弃，改用流式 PCM 播放，保留兼容）
async function playAudio(chunks) {
  if (!chunks.length) return;
  const mp3 = new Blob(chunks, { type: 'audio/mpeg' });
  const url = URL.createObjectURL(mp3);
  const audio = new Audio(url);
  audio.onended = () => URL.revokeObjectURL(url);
  try {
    await audio.play();
  } catch (err) {
    console.error('播放失败:', err);
    log('播放失败：' + err.message, 'log-sys');
  }
}
